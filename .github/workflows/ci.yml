# Build (warnings are errors, both library targets) and the full test suite on every push and pull request,
# on Linux and on Windows (the time-zone code takes a different path there).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build LifeAstroApi.sln -c Release
      - run: dotnet test LifeAstroApi.sln -c Release --no-build
